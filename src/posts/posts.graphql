type Post {
  id: Int!
  title: String!
  description: String!
  user: User!
}

input CreatePostInput {
  title: String!
  description: String!
  userId: Int!
}

input UpdatePostInput {
  id: Int!
  title: String
  description: String
  userId: Int
}

type Query {
  posts: [Post]!
  post(id: Int!): Post
}

type Mutation {
  createPost(createPostInput: CreatePostInput!): Post!
  updatePost(updatePostInput: UpdatePostInput!): Post!
  removePost(id: Int!): Post
}

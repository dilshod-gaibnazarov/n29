type User {
  id: Int!
  username: String!
  fullName: String!
  posts: [Post]!
}

input CreateUserInput {
  username: String!
  fullName: String!
}

input UpdateUserInput {
  id: Int!
  username: String
  fullName: String
}

type Query {
  users: [User]!
  user(id: Int!): User
}

type Mutation {
  createUser(createUserInput: CreateUserInput!): User!
  updateUser(updateUserInput: UpdateUserInput!): User!
  removeUser(id: Int!): User
}
